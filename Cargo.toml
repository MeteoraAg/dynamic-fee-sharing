[workspace]
members = [
    "programs/*"
]
resolver = "2"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1

[workspace.dependencies]
anchor-lang = { version = "1.2.1", default-features = false, features = [
    "solana-v4",
    "event-cpi",
] }
anchor-spl = { version = "1.2.1", default-features = false, features = [
    "solana-v4",
    "token",
    "token_2022",
    "token_2022_extensions",
] }
bytemuck = { version = "1.21", features = ["derive", "min_const_generics"] }

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(target_os, values("solana"))',
] }

[workspace.metadata.cli]
solana = "4.1.2"
