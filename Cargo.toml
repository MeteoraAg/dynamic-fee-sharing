[workspace]
members = [
    "programs/*"
]
resolver = "2"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1

[workspace.dependencies]
anchor-lang = {version = "1.0.2", features = ["event-cpi"]}
anchor-spl = "1.0.2"
bytemuck = { version = "1.21", features = ["derive", "min_const_generics"] }

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(target_os, values("solana"))',
] }

[workspace.metadata.cli]
solana = "3.1.10"

[workspace.lints.clippy]
# Checked math keeps ok_or_else so the error value is built only when the call fails.
# ok_or builds that value on the success path too, and the cost shows up inside loops.
unnecessary_lazy_evaluations = "allow"
