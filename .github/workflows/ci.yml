name: Dynamic-Fee-Sharing

on:
  pull_request:
    branches:
      - main
      - release_*

env:
  SOLANA_CLI_VERSION: 3.1.10
  ANCHOR_CLI_VERSION: 1.0.2
  TOOLCHAIN: 1.93.0

# The runner and every action used more than once are YAML anchors (`&name`), set where
# they're first used and reused with `*name`. Bump them there.
jobs:
  program_changed_files:
    runs-on: &runner ubuntu-26.04
    outputs:
      program: ${{steps.changed-files-specific.outputs.any_changed}}
    steps:
      - uses: &checkout actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Get specific changed files
        id: changed-files-specific
        uses: tj-actions/changed-files@v18.6
        with:
          files: |
            programs/dynamic-fee-sharing

  cargo_test:
    runs-on: *runner
    needs: program_changed_files
    if: needs.program_changed_files.outputs.program == 'true'
    steps:
      - uses: *checkout
      - uses: &rust_toolchain dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (2026-10-16)
        with:
          toolchain: ${{ env.TOOLCHAIN }}
          components: clippy
      # Cache rust, cargo
      - uses: &rust_cache Swatinem/rust-cache@v1
      - run: cargo test --package dynamic-fee-sharing
        shell: bash

  clippy:
    runs-on: *runner
    needs: program_changed_files
    if: needs.program_changed_files.outputs.program == 'true'
    steps:
      - uses: *checkout
      - uses: *rust_toolchain
        with:
          toolchain: ${{ env.TOOLCHAIN }}
          components: clippy
      # Cache rust, cargo
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo clippy --locked --all-targets -- -D warnings
        shell: bash

  program_test:
    runs-on: *runner
    needs: program_changed_files
    if: needs.program_changed_files.outputs.program == 'true'
    steps:
      - uses: *checkout
      - uses: ./.github/actions/setup-solana
      - uses: ./.github/actions/setup-dep
      - uses: ./.github/actions/setup-anchor
      # Install bun
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      # Install rust + toolchain
      - uses: *rust_toolchain
        with:
          toolchain: ${{ env.TOOLCHAIN }}
          components: clippy
      # Cache rust, cargo
      - uses: *rust_cache
      # Cache node_modules
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: cache-node-modules
        with:
          path: ./node_modules
          key: ${{ runner.os }}-${{ hashFiles('./bun.lock') }}
      # Testing
      - run: bun install
        shell: bash
      - run: bun run test
        shell: bash
